<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="title desc">
  <title id="title">Attendance successfully recorded</title>
  <desc id="desc">Original confirmation illustration with a checkmark inside a circular ring and restrained celebratory accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fc"/>
      <stop offset="1" stop-color="#e7eef7"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#428bca"/>
      <stop offset="1" stop-color="#010a2a"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#010a2a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="480" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="70" cy="70" r="74" fill="#428bca" opacity="0.10"/>
  <circle cx="410" cy="292" r="94" fill="#f9ac8a" opacity="0.15"/>

  <g filter="url(#soft)">
    <circle cx="240" cy="170" r="94" fill="#ffffff"/>
    <circle cx="240" cy="170" r="76" fill="none" stroke="url(#ring)" stroke-width="10"/>
    <circle cx="240" cy="170" r="62" fill="#16a36a" opacity="0.10"/>
    <path d="M205 172l24 24 48-52" fill="none" stroke="#16a36a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#f9ac8a">
    <circle cx="116" cy="126" r="7"/>
    <circle cx="360" cy="108" r="5"/>
    <rect x="344" y="226" width="10" height="10" rx="3" transform="rotate(24 349 231)"/>
    <rect x="122" y="238" width="8" height="8" rx="2" transform="rotate(-18 126 242)"/>
  </g>
  <g fill="#428bca" opacity="0.7">
    <circle cx="378" cy="174" r="4"/>
    <circle cx="104" cy="192" r="5"/>
  </g>

  <rect x="156" y="288" width="168" height="16" rx="8" fill="#010a2a" opacity="0.08"/>
  <rect x="186" y="288" width="108" height="16" rx="8" fill="#010a2a" opacity="0.16"/>
</svg>
