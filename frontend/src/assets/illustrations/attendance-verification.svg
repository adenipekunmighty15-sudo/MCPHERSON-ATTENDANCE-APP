<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="title desc">
  <title id="title">Attendance verification</title>
  <desc id="desc">Original illustration of a phone scanning a QR code with a device authentication symbol. No personal information is shown.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fc"/>
      <stop offset="1" stop-color="#e7eef7"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2a4a"/>
      <stop offset="1" stop-color="#010a2a"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#010a2a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="480" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="400" cy="64" r="78" fill="#428bca" opacity="0.10"/>
  <circle cx="66" cy="306" r="96" fill="#f9ac8a" opacity="0.16"/>

