<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="title desc">
  <title id="title">No attendance records yet</title>
  <desc id="desc">Original minimal calendar illustration with empty attendance slots. It shows no student data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fc"/>
      <stop offset="1" stop-color="#e7eef7"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#010a2a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="480" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="398" cy="76" r="82" fill="#428bca" opacity="0.10"/>

  <g filter="url(#soft)">
    <rect x="118" y="62" width="244" height="236" rx="20" fill="#ffffff"/>
    <rect x="118" y="62" width="244" height="56" rx="20" fill="#010a2a"/>
    <rect x="118" y="98" width="244" height="20" fill="#010a2a"/>
  </g>
  <rect x="156" y="44" width="12" height="36" rx="6" fill="#f9ac8a"/>
  <rect x="312" y="44" width="12" height="36" rx="6" fill="#f9ac8a"/>
  <text x="150" y="99" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">ATTENDANCE</text>

  <g fill="#f6f8fc" stroke="none">
    <rect x="146" y="142" width="48" height="42" rx="8"/>
    <rect x="216" y="142" width="48" height="42" rx="8"/>
    <rect x="286" y="142" width="48" height="42" rx="8"/>
    <rect x="146" y="200" width="48" height="42" rx="8"/>
    <rect x="216" y="200" width="48" height="42" rx="8"/>
    <rect x="286" y="200" width="48" height="42" rx="8"/>
  </g>
  <g fill="#428bca" opacity="0.28">
    <rect x="154" y="150" width="32" height="6" rx="3"/>
    <rect x="224" y="150" width="32" height="6" rx="3"/>
    <rect x="294" y="150" width="32" height="6" rx="3"/>
    <rect x="154" y="208" width="32" height="6" rx="3"/>
    <rect x="224" y="208" width="32" height="6" rx="3"/>
    <rect x="294" y="208" width="32" height="6" rx="3"/>
  </g>
  <circle cx="170" cy="225" r="9" fill="none" stroke="#f9ac8a" stroke-width="3"/>
  <circle cx="240" cy="225" r="9" fill="none" stroke="#f9ac8a" stroke-width="3"/>
  <circle cx="310" cy="225" r="9" fill="none" stroke="#f9ac8a" stroke-width="3"/>

  <text x="240" y="272" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#010a2a" opacity="0.55">No records for this filter</text>
</svg>
